spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    chat:
      model: ${PATCHIE_CHAT_MODEL:}
      base-url: ${PATCHIE_CHAT_BASE_URL:}
      api-key: ${PATCHIE_CHAT_API_KEY:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    io:
      steviemul:
        patch: INFO