spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    chat:
      model: ${CHAT_MODEL:llama3.2}
      base-url: ${CHAT_BASE_URL:http://localhost:11434}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    io:
      steviemul:
        patch: INFO